# Builds the browser extension (Chromium .zip, Firefox .xpi). On tags the
# files are attached to the GitHub release, otherwise kept as artifacts.
name: extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check syntax
        run: for f in web/*.js extension/*.js; do node --check "$f"; done
      - name: Build
        run: ./extension/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist/*
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "COMPANION_VERSION = '$v'" web/shared.js
          grep -q "\"version\": \"$v\"" extension/manifest.json
          grep -q "\"version\": \"$v\"" extension/manifest.chromium.json

  # Only the release job may write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
