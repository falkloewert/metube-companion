# MeTube Companion on your own computer (Docker Desktop on Windows/macOS,
# Docker on Linux). Starts MeTube and the companion together.
#
#   docker compose -f compose.desktop.yml up -d
#   open http://localhost:8081
#
# Only reachable from this computer (127.0.0.1), so no login is needed.
# Downloads land in METUBE_DOWNLOADS (default: ./downloads next to this file).
#
# Also fits a server without MeTube: put these lines into a .env file next to
# this file (see INSTALL.md 4.2) instead of editing it.
#   COMPANION_BIND=0.0.0.0    # reachable from other devices (no login!)
#   COMPANION_PORT=8081
#   TZ=Europe/Berlin
#   YTDL_UPDATE_TIME=04:00

services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Owner of the downloads; on Linux run `id` to see yours. Docker Desktop
      # on Windows/macOS ignores this.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /state
      TEMP_DIR: /downloads/.tmp
      # The companion decides per request (delete all formats, or "History only").
      DELETE_FILE_ON_TRASHCAN: "ask"
      # Required by the companion: video ID in file names (groups the formats
      # of a video) and the "text" preset (a failed caption track is a
      # warning, not an error).
      OUTPUT_TEMPLATE: "%(title)s [%(id)s].%(ext)s"
      YTDL_OPTIONS_PRESETS: '{"text": {"ignoreerrors": true}}'
      # YouTube changes often; MeTube updates yt-dlp itself every day at this
      # time (while the computer is on).
      YTDL_NIGHTLY_UPDATE_TIME: "${YTDL_UPDATE_TIME:-12:00}"
      # Time zone for the update time above (default UTC).
      TZ: "${TZ:-UTC}"
    volumes:
      - "${METUBE_DOWNLOADS:-./downloads}:/downloads"
      - metube-state:/state

  companion:
    image: ghcr.io/falkloewert/metube-companion:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      - metube
    environment:
      METUBE_URL: http://metube:8081
      # Files stay until you delete them. Set e.g. 30 to clean up automatically
      # (applies to every file in the download folder).
      RETENTION_DAYS: "0"
      # Deleted videos wait this many days in a trash (hidden folder .trash)
      # before they are removed for good; "Restore" in the web UI brings them
      # back. 0 = no trash, files are deleted right away (an old trash is emptied).
      TRASH_DAYS: "7"
      # Optional access token (16-128 characters: A-Z a-z 0-9 . _ -), useful when
      # other devices can reach this instance.
      # COMPANION_TOKEN: "change-me-to-a-long-random-string"
    ports:
      - "${COMPANION_BIND:-127.0.0.1}:${COMPANION_PORT:-8081}:8080"
    volumes:
      - "${METUBE_DOWNLOADS:-./downloads}:/downloads"

  # Optional: keep the images themselves up to date. Only touches the two
  # services above (--label-enable). Access to the Docker socket is equivalent
  # to root on this machine; leave it off if that matters to you.
  # updater:
  #   image: ghcr.io/nicholas-fedor/watchtower:latest
  #   restart: unless-stopped
  #   command: --label-enable --cleanup --interval 86400
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
  metube-state:
