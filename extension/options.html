<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MeTube Companion: Settings</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      max-width: 520px; margin: 40px auto; padding: 0 16px;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #eef1f5; color: #16202b;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1216; color: #e9eef5; }
      .card { background: #1b212a !important; border-color: #2c3642 !important; }
      input { background: #252e3a !important; color: #e9eef5 !important; }
    }
    .card { background: #fff; border: 1px solid #d9e0e9; border-radius: 28px; padding: 22px; }
    label { display: block; font-size: 13px; margin-bottom: 8px; color: #59677a; }
    input {
      width: 100%; box-sizing: border-box; height: 46px; padding: 0 16px;
      border: 0; border-radius: 999px; background: #e8edf4; color: inherit; font: inherit;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid #0b6bcb; outline-offset: 2px; }
    button {
      margin-top: 14px; height: 46px; padding: 0 22px; border: 0; border-radius: 999px;
      background: #0b6bcb; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    p { font-size: 13px; color: #59677a; }
    #status { min-height: 20px; }
  </style>
</head>
<body>
  <h1 style="font-size:20px">MeTube Companion</h1>
  <div class="card">
    <label for="base">Address of the MeTube instance</label>
    <input id="base" type="url" placeholder="http://localhost:8081" spellcheck="false">
    <button id="save">Save</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p>The extension sends your cookies for YouTube, Google, Instagram and TikTok so that signed-in content can be downloaded. No other sites get cookies. The cookies are then stored on the MeTube server in <code>state/cookies.txt</code>.</p>
  </div>
  <script src="compat.js"></script>
  <script src="options.js"></script>
</body>
</html>
